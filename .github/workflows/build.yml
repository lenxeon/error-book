name: Build Android and iOS
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npx expo export --platform web
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npx expo prebuild --platform android --clean --no-install
      # Expo's generated release variant uses the generated debug keystore for personal installation.
      # For store distribution, replace this with a protected release keystore.
      - name: Assemble installable Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: maisen-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  ios:
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build unsigned device IPA for Sideloadly
        run: bash scripts/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: maisen-ios-unsigned-ipa
          path: artifacts/maisen-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
